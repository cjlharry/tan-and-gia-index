name: Update snapshot and publish

on:
  schedule:
    - cron: "17 23 * * 1-5"     # 23:17 UTC Mon–Fri = 07:17 Singapore Tue–Sat, after the US close
  workflow_dispatch:             # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore: [snapshot-data.js]   # dashboard edits redeploy; the bot's own commit is deployed below

permissions:
  contents: write    # commit snapshot-data.js
  pages: write       # publish to GitHub Pages
  id-token: write
  actions: read      # deploy-pages reads the uploaded artifact

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # covers the 6-minute rate-limit cool-down
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Build snapshot
        if: github.event_name != 'push'
        continue-on-error: true   # partial failures keep last good values; still publish
        run: python update_snapshot.py --out snapshot-data.js

      - name: Commit snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add snapshot-data.js
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Snapshot $(date -u +%F)"
          git pull --rebase --quiet origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f snapshot-data.js ] && cp snapshot-data.js _site/ || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
